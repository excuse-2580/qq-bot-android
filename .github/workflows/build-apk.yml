name: Build Android APK

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # 固定 22.04：24.04 移除了 libtinfo5 等 buildozer 依赖的老包
    runs-on: ubuntu-22.04
    timeout-minutes: 300

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 缓存 buildozer 下载（SDK / NDK）
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ runner.os }}-api34-v1
          restore-keys: buildozer-${{ runner.os }}-

      - name: 安装系统依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            git zip unzip python3-pip python3-dev python3-venv \
            autoconf libtool pkg-config zlib1g-dev \
            libncurses-dev libffi-dev libssl-dev \
            automake make gcc g++ wget curl lld

      - name: 安装 buildozer
        run: |
          python3 -m pip install --upgrade pip setuptools wheel
          python3 -m pip install --upgrade buildozer
          buildozer --version

      - name: 准备内置规则文件
        run: |
          mkdir -p data
          test -f data/rules.json || echo '{"rules":[]}' > data/rules.json

      - name: 构建 APK（20～40 分钟）
        id: apk
        run: |
          set -o pipefail
          yes | buildozer -v android debug 2>&1 | tee build.log
          echo "===== 构建成功 ====="
          ls -lh bin/

      - name: 上传 APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: qqbot-apk
          path: bin/*.apk
          if-no-files-found: warn
          retention-days: 30

      - name: 把构建日志写回 logs 分支
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 ci/report_log.py ${{ steps.apk.outcome == 'success' && 'success' || 'failure' }}
